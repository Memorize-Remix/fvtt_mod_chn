name: 合并汉化并打包 Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq xxd

      # 🔥 删除原文件，用原始字符串重建
      - name: 暴力重建 inspect-statblock/cn.json
        run: |
          FILE="fvtt mod汉化/inspect-statblock/cn.json"
          echo "删除旧文件..."
          rm -f "$FILE"
          
          echo "创建新文件..."
          # 使用 printf 写入每一行，确保结尾有换行
          printf '{\n' > "$FILE"
          printf '\t"INSPECTSTATBLOCK": {\n' >> "$FILE"
          printf '      "MODULE.NAME": "Inspect Statblock",\n' >> "$FILE"
          printf '      "MODULE.DESCRIPTION": "一个允许你查看角色属性的模组。",\n' >> "$FILE"
          printf '      "KEYBINDING.OPEN": "打开Inspect Statblock",\n' >> "$FILE"
          printf '      "NOTIFICATIONS.NO_TOKEN": "请选择一个角色。",\n' >> "$FILE"
          printf '      "NOTIFICATIONS.NO_ACTOR": "选中的角色没有关联的属性。"\n' >> "$FILE"
          printf '    }\n' >> "$FILE"
          printf '}\n' >> "$FILE"
          
          echo "文件内容（cat -A）："
          cat -A "$FILE"
          echo ""
          echo "文件大小和行数："
          wc -c "$FILE"
          wc -l "$FILE"
          echo ""
          echo "文件头部十六进制（前100字节）："
          xxd -c 16 -l 100 "$FILE"
          echo ""
          
          echo "现在用 jq 验证："
          if jq empty "$FILE"; then
            echo "✅ 验证成功"
          else
            echo "❌ 验证失败，错误码：$?"
            echo "尝试打印 jq 详细错误："
            jq . "$FILE" 2>&1 || true
            exit 1
          fi

      # 验证所有 cn.json（此时应该全部通过）
      - name: 验证所有 cn.json
        run: |
          echo "开始验证所有 cn.json 文件..."
          find "fvtt mod汉化" -name "cn.json" -print0 | while IFS= read -r -d '' file; do
            echo "检查: $file"
            if ! jq empty "$file"; then
              echo "❌ 错误文件: $file"
              exit 1
            fi
          done
          echo "✅ 所有 cn.json 文件格式正确"

      # 合并
      - name: 合并所有 cn.json
        run: |
          find "fvtt mod汉化" -name "cn.json" -exec cat {} + | jq -s 'reduce .[] as $item ({}; . * $item)' > cn.json
          echo "合并完成，大小："
          ls -lh cn.json

      # 打包
      - name: 准备打包文件夹
        run: |
          mkdir package
          cp cn.json package/
          cp welcome.js package/ || echo "⚠️ welcome.js 不存在"
          cp module.json package/ || echo "⚠️ module.json 不存在"
          ls -la package/

      - name: 打包成 zip
        run: |
          cd package
          zip -r ../汉化包.zip .
          cd ..

      - name: 上传附件到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: 汉化包.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
