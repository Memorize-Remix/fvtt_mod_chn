name: 合并汉化并打包 Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 jq 和 dos2unix
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dos2unix

      # 将所有 cn.json 的换行符统一转为 LF（Unix 风格）
      - name: 统一换行符为 LF
        run: |
          echo "转换所有 cn.json 的换行符为 LF..."
          find "fvtt mod汉化" -name "cn.json" -exec dos2unix {} \;
          echo "转换完成"

      # 验证所有 cn.json 是否合法
      - name: 验证所有 cn.json
        run: |
          echo "开始验证所有 cn.json 文件..."
          find "fvtt mod汉化" -name "cn.json" -print0 | while IFS= read -r -d '' file; do
            echo "检查: $file"
            if ! jq empty "$file"; then
              echo "❌ 错误文件: $file"
              exit 1
            fi
          done
          echo "✅ 所有 cn.json 文件格式正确"

      # 合并所有 cn.json（深度合并）
      - name: 合并所有 cn.json
        run: |
          find "fvtt mod汉化" -name "cn.json" -exec cat {} + | jq -s 'reduce .[] as $item ({}; . * $item)' > cn.json
          echo "合并完成，文件大小："
          ls -lh cn.json
          echo "内容预览（前10行）："
          head -n 10 cn.json

      # 准备打包文件夹（复制合并后的 cn.json、welcome.js、module.json）
      - name: 准备打包文件夹
        run: |
          mkdir package
          cp cn.json package/
          cp welcome.js package/ || echo "⚠️ welcome.js 不存在"
          cp module.json package/ || echo "⚠️ module.json 不存在"
          ls -la package/

      # 打包成 zip
      - name: 打包成 zip
        run: |
          cd package
          zip -r ../汉化包.zip .
          cd ..

      # 上传附件到 Release
      - name: 上传附件到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: 汉化包.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
