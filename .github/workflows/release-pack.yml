name: 合并汉化并打包 Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 jq 和 dos2unix
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dos2unix

      # 统一所有 cn.json 的换行符为 LF
      - name: 统一换行符为 LF
        run: |
          echo "转换所有 cn.json 的换行符为 LF..."
          find "fvtt mod汉化" -name "cn.json" -exec dos2unix {} \;

      # 🛠️ 针对 inspect-statblock/cn.json 进行强制修复
      - name: 修复 inspect-statblock/cn.json
        run: |
          FILE="fvtt mod汉化/inspect-statblock/cn.json"
          echo "正在修复 $FILE ..."
          
          # 去除文件末尾的空白字符（换行、空格等）
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$FILE" 2>/dev/null || true
          
          # 获取最后一个非空白字符的十六进制值
          LAST_CHAR=$(tail -c 1 "$FILE" | od -An -tx1 | tr -d ' \n')
          # '}' 的十六进制是 7d
          if [ "$LAST_CHAR" != "7d" ]; then
            echo "文件末尾不是 '}'，追加一个 '}'"
            echo '}' >> "$FILE"
          else
            echo "文件末尾已是 '}'"
          fi
          
          # 再次用 jq 尝试格式化，如果能成功，则用 jq 重新输出干净格式（可选）
          if jq empty "$FILE" 2>/dev/null; then
            echo "✅ 修复后格式正确"
          else
            echo "⚠️ 修复后仍然报错，请手动检查文件内容"
            # 可选：输出文件内容以便排查
            cat -A "$FILE"
            exit 1
          fi

      # 验证所有 cn.json 是否合法（此时应该全部通过）
      - name: 验证所有 cn.json
        run: |
          echo "开始验证所有 cn.json 文件..."
          find "fvtt mod汉化" -name "cn.json" -print0 | while IFS= read -r -d '' file; do
            echo "检查: $file"
            if ! jq empty "$file"; then
              echo "❌ 错误文件: $file"
              exit 1
            fi
          done
          echo "✅ 所有 cn.json 文件格式正确"

      # 合并所有 cn.json
      - name: 合并所有 cn.json
        run: |
          find "fvtt mod汉化" -name "cn.json" -exec cat {} + | jq -s 'reduce .[] as $item ({}; . * $item)' > cn.json
          echo "合并完成，文件大小："
          ls -lh cn.json

      # 准备打包
      - name: 准备打包文件夹
        run: |
          mkdir package
          cp cn.json package/
          cp welcome.js package/ || echo "⚠️ welcome.js 不存在"
          cp module.json package/ || echo "⚠️ module.json 不存在"
          ls -la package/

      # 打包成 zip
      - name: 打包成 zip
        run: |
          cd package
          zip -r ../汉化包.zip .
          cd ..

      # 上传附件到 Release
      - name: 上传附件到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: 汉化包.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
