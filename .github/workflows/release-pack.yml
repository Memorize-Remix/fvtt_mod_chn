name: Release Pack

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge all mod cn.json into one cn.json
        run: python scripts/merge_cn.py

      - name: Build mod_chn.zip
        run: zip -r -9 mod_chn.zip cn.json module.json welcome.js

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mod_chn.zip
            module.json

      - name: Upload artifacts (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mod_chn
          path: |
            cn.json
            mod_chn.zip
            module.json
